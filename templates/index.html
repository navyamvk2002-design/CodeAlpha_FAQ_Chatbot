
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101828">
    <title>FAQ Assistant | Support Center</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #182230;
        }

        .app {
            width: 100%;
            max-width: 760px;
            height: min(780px, 92vh);
            min-height: 550px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(16, 24, 40, 0.09);
        }

        .header {
            background: #101828;
            color: #fff;
            padding: 23px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            background: #263b5c;
            display: grid;
            place-items: center;
            font-size: 21px;
        }

        .header h1 {
            font-size: 19px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: #b8c3d4;
        }

        .online {
            font-size: 12px;
            color: #9ce6bd;
        }

        .content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .welcome {
            padding: 22px 25px 12px;
        }

        .welcome h2 {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .welcome p {
            font-size: 13px;
            color: #667085;
            line-height: 1.5;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 25px 15px;
        }

        .suggestion {
            background: #fff;
            border: 1px solid #d9e0ea;
            border-radius: 20px;
            padding: 8px 12px;
            color: #344054;
            font-size: 12px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #edf3ff;
            border-color: #8aa9e8;
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px 25px;
            background: #fafbfc;
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 82%;
        }

        .message-row.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-row.bot {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message {
            padding: 12px 15px;
            border-radius: 13px;
            font-size: 14px;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        .bot .message {
            background: #edf1f7;
            color: #253247;
            border-bottom-left-radius: 3px;
        }

        .user .message {
            background: #2457c5;
            color: #fff;
            border-bottom-right-radius: 3px;
        }

        .timestamp {
            font-size: 10px;
            color: #98a2b3;
            margin: 5px 3px 0;
        }

        .typing {
            display: none;
            align-self: flex-start;
            background: #edf1f7;
            border-radius: 12px;
            padding: 12px 16px;
            color: #667085;
            font-size: 12px;
        }

        .typing.visible {
            display: block;
        }

        .input-area {
            padding: 17px 22px 12px;
            background: #fff;
            border-top: 1px solid #eaecf0;
        }

        .input-form {
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            min-width: 0;
            padding: 14px 15px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        #userInput:focus {
            border-color: #4778d5;
            box-shadow: 0 0 0 3px rgba(71, 120, 213, 0.1);
        }

        #sendButton {
            border: none;
            background: #2457c5;
            color: white;
            padding: 0 23px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #1948aa;
        }

        #sendButton:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
        }

        .bottom-bar span {
            font-size: 10px;
            color: #98a2b3;
        }

        #clearButton {
            border: none;
            background: transparent;
            color: #667085;
            font-size: 11px;
            cursor: pointer;
        }

        #clearButton:hover {
            color: #2457c5;
        }

        @media (max-width: 550px) {
            body {
                padding: 0;
            }

            .app {
                height: 100vh;
                min-height: 0;
                border-radius: 0;
                border: none;
            }

            .header {
                padding: 19px;
            }

            .welcome {
                padding: 18px 17px 12px;
            }

            .suggestions {
                padding: 0 17px 13px;
            }

            .messages {
                padding: 17px;
            }

            .input-area {
                padding: 13px;
            }

            .message-row {
                max-width: 90%;
            }

            #sendButton {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <header class="header">
            <div class="brand">
                <div class="brand-icon">✦</div>
                <div>
                    <h1>FAQ Assistant</h1>
                    <p>Customer Support Center</p>
                </div>
            </div>
            <div class="online">● Online</div>
        </header>

        <section class="content">

            <div class="welcome">
                <h2>Hello! How can I help you today?</h2>
                <p>Ask a question or select one of the suggestions below.</p>
            </div>

            <div class="suggestions">
                <button class="suggestion" data-question="What are your office hours?">
                    Office hours
                </button>
                <button class="suggestion" data-question="How can I contact support?">
                    Contact support
                </button>
                <button class="suggestion" data-question="Where are you located?">
                    Location
                </button>
                <button class="suggestion" data-question="What services do you provide?">
                    Our services
                </button>
            </div>

            <div class="messages" id="chatMessages">
                <div class="message-row bot">
                    <div class="message">
                        Hello! Welcome to our support center.
                        How can I assist you today?
                    </div>
                    <span class="timestamp">Just now</span>
                </div>

                <div class="typing" id="typingIndicator">
                    Assistant is typing...
                </div>
            </div>

        </section>

        <footer class="input-area">
            <form class="input-form" id="chatForm">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your question..."
                    autocomplete="off"
                    maxlength="500"
                    required
                >
                <button type="submit" id="sendButton">Send</button>
            </form>

            <div class="bottom-bar">
                <span>Powered by TF-IDF &amp; Cosine Similarity</span>
                <button type="button" id="clearButton">Clear chat ↻</button>
            </div>
        </footer>

    </main>

    <script>
        const chatMessages = document.getElementById("chatMessages");
        const chatForm = document.getElementById("chatForm");
        const userInput = document.getElementById("userInput");
        const sendButton = document.getElementById("sendButton");
        const clearButton = document.getElementById("clearButton");
        const typingIndicator = document.getElementById("typingIndicator");

        function getTime() {
            return new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function addMessage(message, sender) {
            const row = document.createElement("div");
            row.className = `message-row ${sender}`;

            const bubble = document.createElement("div");
            bubble.className = "message";
            bubble.textContent = message;

            const time = document.createElement("span");
            time.className = "timestamp";
            time.textContent = getTime();

            row.appendChild(bubble);
            row.appendChild(time);

            chatMessages.insertBefore(row, typingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage(question) {
            const message = question.trim();

            if (!message || sendButton.disabled) return;

            addMessage(message, "user");
            userInput.value = "";
            sendButton.disabled = true;
            typingIndicator.classList.add("visible");

            try {
                const response = await fetch("/get_response", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();

                if (typeof data.answer !== "string") {
                    throw new Error("Invalid response");
                }

                addMessage(data.answer, "bot");

            } catch (error) {
                addMessage(
                    "Unable to connect right now. Please try again.",
                    "bot"
                );
            } finally {
                typingIndicator.classList.remove("visible");
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        chatForm.addEventListener("submit", function(event) {
            event.preventDefault();
            sendMessage(userInput.value);
        });

        document.querySelectorAll(".suggestion").forEach(button => {
            button.addEventListener("click", function() {
                sendMessage(this.dataset.question);
            });
        });

        clearButton.addEventListener("click", function() {
            chatMessages.querySelectorAll(".message-row").forEach(row => {
                row.remove();
            });

            const welcome = document.createElement("div");
            welcome.className = "message-row bot";

            const bubble = document.createElement("div");
            bubble.className = "message";
            bubble.textContent = "Hello! Welcome to our support center. How can I assist you today?";

            const time = document.createElement("span");
            time.className = "timestamp";
            time.textContent = "Just now";

            welcome.appendChild(bubble);
            welcome.appendChild(time);

            chatMessages.insertBefore(welcome, typingIndicator);
            userInput.focus();
        });
    </script>

</body>
</html>
